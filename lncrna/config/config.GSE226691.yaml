# =================================================================================================
#  Dataset: GSE226691 - Kornienko et al. 2024 (Plant Cell), seedling, 9-leaf rosette, flower, pollen
#  Library: TruSeq Stranded mRNA (polyA, dUTP -> "reverse"), Illumina HiSeq 2500, PE 150 bp
#  Design : seedling + 9-leaf rosette: 27 accessions; flower + pollen: 25 accessions; 1 sample per
#           accession and tissue (no replicates); 23 accessions have all 4 tissues
#  Role   : tissue extension of the discovery annotation; tissue-aware stratification
# =================================================================================================

samples: "config/samples.GSE226691.csv"

reference:
  ensembl_release: 59
  species: "arabidopsis_thaliana"
  assembly: "TAIR10"
  chromosomes: ["1", "2", "3", "4", "5", "Mt", "Pt"]
  lncrna_chromosomes: ["1", "2", "3", "4", "5"]
  te_annotation_url: "https://www.arabidopsis.org/download_files/Genes/TAIR10_genome_release/TAIR10_transposable_elements/TAIR10_Transposable_Elements.txt"
  # Recommended: feed the lncRNA GTF produced by the GSE224760 run so loci are shared across runs
  # extra_lncrna_gtf: ["/data/runs/GSE224760/lncrna/lncrna.gtf"]
  extra_lncrna_gtf: []

genotypes:
  vcf_url: "https://1001genomes.org/data/GMI-MPI/releases/v3.1/1001genomes_snp-short-indel_only_ACGTN.vcf.gz"
  vcf: "resources/1001genomes_snp-short-indel_only_ACGTN.vcf.gz"
  maf: 0.05
  max_missing: 0.1

params:
  threads: 16
  fastp: "--detect_adapter_for_pe --cut_right --cut_right_window_size 4 --cut_right_mean_quality 20 --length_required 36"
  sortmerna: false
  sortmerna_db_url: "https://github.com/biocore/sortmerna/releases/download/v4.3.4/database.tar.gz"
  star_sjdb_overhang: 149          # 150 bp reads
  star_extra: "--alignIntronMax 6000 --alignMatesGapMax 6000 --outFilterIntronMotifs RemoveNoncanonical --outFilterMismatchNoverReadLmax 0.1 --outFilterMismatchNoverLmax 0.3 --outFilterMultimapNmax 10 --alignSJoverhangMin 8 --outSAMstrandField intronMotif"
  stringtie_assemble: "-c 2 -m 150 -j 2.5 -a 15"
  stringtie_merge: "-m 200 -c 1 -F 0.5 -T 1"
  strand_subsample: 500000

lncrna_filter:
  min_length: 200
  min_length_monoexonic: 400
  class_codes: ["u", "x", "i"]
  min_exons_intergenic: 1
  min_tpm: 0.5
  min_samples: 2                   # with 1 sample per accession x tissue this means 2 accessions or 2 tissues
  use_feelnc: false
  use_pfam: false
  pfam_url: "https://ftp.ebi.ac.uk/pub/databases/Pfam/current_release/Pfam-A.hmm.gz"

analysis:
  expressed_tpm: 1.0
  expressed_frac: 0.10
  # ON/OFF threshold for the binary (Jaccard) stratification layer (Kornienko 2024: TPM > 0.5)
  on_tpm: 0.5
  top_variable: 2000
  consensus:
    max_k: 8
    reps: 1000
    p_item: 0.8
    cluster_alg: "pam"
    distance: "pearson"
    seed: 1234
  signature:
    alpha: 0.5
    outer_folds: 4
    inner_folds: 5
  eqtl:
    cis_window: 100000
    n_hidden_factors: 5
    fdr: 0.05
  external_labels: ""
