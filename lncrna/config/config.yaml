# =================================================================================================
#     lncRNA population workflow - configuration
# =================================================================================================

# Sample sheet (CSV). Required columns:
#   sample        unique sample id (used for file names)
#   fastq_1       path or ftp/https URL to read 1
#   fastq_2       path/URL to read 2, empty for single-end
#   accession     accession / genotype label (e.g. "Col-0", "6909")
#   accession_id  1001 Genomes numeric id (e.g. 6909) or empty; needed for eQTL
#   tissue        tissue / developmental stage
#   condition     "control", "drought", ... (used by the G x E analysis if >1 level)
#   study         source study (GSE id)
#   batch         optional growth/sequencing batch (e.g. rep1..rep4 in GSE224760); defaults to study
#   strandedness  "auto", "reverse", "forward", "unstranded"
# Build it with find_datasets.py (sample sheets per study) and/or make_samplesheet_from_gse.py.
samples: "config/samples.csv"

# Working/output directory layout is relative to the snakemake --directory.

reference:
  # Ensembl Plants release used for genome and annotation (Arabidopsis thaliana TAIR10 / Araport11)
  ensembl_release: 59
  species: "arabidopsis_thaliana"
  assembly: "TAIR10"
  # Chromosomes to keep (Ensembl naming). Mt/Pt excluded from lncRNA calling but kept for mapping.
  chromosomes: ["1", "2", "3", "4", "5", "Mt", "Pt"]
  lncrna_chromosomes: ["1", "2", "3", "4", "5"]
  # TAIR10 transposable element annotation (TAIR download). Used to flag TE-overlapping lncRNAs.
  te_annotation_url: "https://www.arabidopsis.org/download_files/Genes/TAIR10_genome_release/TAIR10_transposable_elements/TAIR10_Transposable_Elements.txt"
  # Optional: extra lncRNA GTF(s) to merge into the annotation before quantification
  # (e.g. Kornienko et al. 2024 GEO GSE224760 supplementary GTF, CANTATAdb, PLncDB).
  # Chromosome names must match Ensembl ("1".."5"). Leave empty list to skip.
  extra_lncrna_gtf: []

genotypes:
  # 1001 Genomes VCF (SNPs + short indels). Downloaded if missing.
  vcf_url: "https://1001genomes.org/data/GMI-MPI/releases/v3.1/1001genomes_snp-short-indel_only_ACGTN.vcf.gz"
  vcf: "resources/1001genomes_snp-short-indel_only_ACGTN.vcf.gz"
  # Minor allele frequency and missingness filters for the eQTL genotype matrix
  maf: 0.05
  max_missing: 0.1

params:
  threads: 16
  fastp: "--detect_adapter_for_pe --cut_right --cut_right_window_size 4 --cut_right_mean_quality 20 --length_required 36"
  # Run SortMeRNA to remove rRNA reads. Recommended for total RNA / ribo-depleted libraries.
  sortmerna: true
  sortmerna_db_url: "https://github.com/biocore/sortmerna/releases/download/v4.3.4/database.tar.gz"
  star_sjdb_overhang: 99          # read length - 1
  # STAR options as in Kornienko et al. 2024 (short Arabidopsis introns), plus XS for StringTie
  star_extra: "--alignIntronMax 6000 --alignMatesGapMax 6000 --outFilterIntronMotifs RemoveNoncanonical --outFilterMismatchNoverReadLmax 0.1 --outFilterMismatchNoverLmax 0.3 --outFilterMultimapNmax 10 --alignSJoverhangMin 8 --outSAMstrandField intronMotif"
  # StringTie options as in Kornienko et al. 2024
  stringtie_assemble: "-c 2 -m 150 -j 2.5 -a 15"
  stringtie_merge: "-m 200 -c 1 -F 0.5 -T 1"
  # Subsample size (read pairs) for strandedness inference with salmon
  strand_subsample: 500000

lncrna_filter:
  min_length: 200
  # single-exon transcripts need to be longer (Kornienko et al. 2024 used 400 nt)
  min_length_monoexonic: 400
  # gffcompare class codes kept as lncRNA candidates:
  #   u = intergenic, x = antisense exonic overlap, i = fully intronic, o = other-strand overlap excluded
  class_codes: ["u", "x", "i"]
  # minimum exon count for intergenic candidates (set 1 to keep mono-exonic lincRNAs)
  min_exons_intergenic: 1
  # expression support: TPM >= min_tpm in at least min_samples samples
  min_tpm: 0.5
  min_samples: 2
  # coding potential: CPC2 always; FEELnc optional (slower, needs training)
  use_feelnc: false
  # Pfam domain scan with hmmscan on 3 frames (slow); false to skip
  use_pfam: false
  pfam_url: "https://ftp.ebi.ac.uk/pub/databases/Pfam/current_release/Pfam-A.hmm.gz"

analysis:
  # Expression filter for the matrices: expressed (TPM >= tpm) in at least frac of samples
  expressed_tpm: 1.0
  expressed_frac: 0.10
  # Number of most variable features for clustering
  # ON/OFF threshold for the binary (Jaccard) stratification layer (Kornienko 2024: TPM > 0.5)
  on_tpm: 0.5
  top_variable: 2000
  # Consensus clustering
  consensus:
    max_k: 10
    reps: 1000
    p_item: 0.8
    cluster_alg: "pam"
    distance: "pearson"
    seed: 1234
  # Signature (glmnet multinomial elastic-net), nested CV
  signature:
    alpha: 0.5
    outer_folds: 5
    inner_folds: 5
  # eQTL (MatrixEQTL), cis window in bp, number of PEER-like hidden factors (PCA used)
  eqtl:
    cis_window: 100000
    n_hidden_factors: 10
    fdr: 0.05
  # Optional: external accession labels to compare clusters against
  # CSV with columns accession_id,label (e.g. admixture group from 1001genomes.org)
  external_labels: ""
